services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchhub-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://launchhub:launchhub_secure_pwd@postgres:5432/launchhub?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=super-secure-production-secret-must-be-changed-in-prod
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: launchhub-postgres
    restart: always
    environment:
      POSTGRES_DB: launchhub
      POSTGRES_USER: launchhub
      POSTGRES_PASSWORD: launchhub_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchhub -d launchhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
